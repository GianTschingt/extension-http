name: Java CI Combined

on: [push, pull_request, workflow_dispatch]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      lucee-versions: ${{ steps.lucee-versions.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # the Lucee versions to test with come only from the variable LUCEE_TEST_VERSIONS_9 (organization or repository),
      # there is no fallback version in this file, without the variable the build fails here with a clear message
      - name: Lucee versions to test with
        id: lucee-versions
        env:
          LUCEE_TEST_VERSIONS_9: ${{ vars.LUCEE_TEST_VERSIONS_9 }}
        run: |
          if [ -z "${LUCEE_TEST_VERSIONS_9}" ]; then
            echo "::error::the variable LUCEE_TEST_VERSIONS_9 is not set, set it (organization or repository) to the Lucee versions to test with, e.g. [{\"version\":\"<Lucee 9 version>\",\"branch\":\"9.0\"}]"
            exit 1
          fi
          if ! echo "${LUCEE_TEST_VERSIONS_9}" | jq -e 'type == "array" and length > 0 and all(.[]; (.version | type == "string" and length > 0) and (.branch | type == "string" and length > 0))' > /dev/null; then
            echo "::error::the variable LUCEE_TEST_VERSIONS_9 must be a non empty JSON array of {\"version\":...,\"branch\":...}, it is: ${LUCEE_TEST_VERSIONS_9}"
            exit 1
          fi
          echo "versions=$(echo "${LUCEE_TEST_VERSIONS_9}" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Lucee files
        uses: actions/cache@v4
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

  build-and-test:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.lucee-versions) }}
    # the cfhttp tests of Lucee use httpbin, the same image the Lucee build uses
    services:
      httpbin:
        image: ghcr.io/lucee/httpbin:test-mirror
        ports:
          - 8081:80
    steps:
      - uses: actions/checkout@v4

      # the Lucee 9 jar has Java 21 class files, so javac needs 21 (the extension itself is still compiled with source/target 11)
      - name: Set up JDK 21 (build and Lucee test run)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Install with Maven (for testing only)
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "------- Maven Install (to create a local test build) -------";
          mvn -B -e -f pom.xml clean install -Dgoal=install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: http-lex-${{ matrix.lucee.version }}
          path: |
            target/*.lex
            !target/*.lite.lex

      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          path: lucee
          ref: ${{ matrix.lucee.branch }}

      # Lucee 9 alphas are not on update.lucee.org / the CDN, so fetch the light jar from Maven Central,
      # falling back to the Maven repository in the variable LUCEE_MAVEN_URL (the Lucee builds that are not released to Central)
      # (the version comes from the LUCEE_TEST_VERSIONS_9 matrix entry)
      - name: Download Lucee light jar from Maven Central or the Lucee Maven repository
        id: lucee-jar
        env:
          LUCEE_VERSION: ${{ matrix.lucee.version }}
          LUCEE_MAVEN_URL: ${{ vars.LUCEE_MAVEN_URL }}
        run: |
          JAR="${{ runner.temp }}/lucee-light-${LUCEE_VERSION}.jar"
          MAVEN_PATH="org/lucee/lucee/${LUCEE_VERSION}/lucee-${LUCEE_VERSION}-light.jar"
          URL="https://repo1.maven.org/maven2/${MAVEN_PATH}"
          echo "Downloading ${URL}"
          if ! curl -fsSL --retry 3 -o "${JAR}" "${URL}"; then
            rm -f "${JAR}"
            if [ -z "${LUCEE_MAVEN_URL}" ]; then
              echo "::error::${LUCEE_VERSION} is not on Maven Central and the variable LUCEE_MAVEN_URL is not set"
              exit 1
            fi
            URL="${LUCEE_MAVEN_URL%/}/${MAVEN_PATH}"
            echo "Not on Maven Central, downloading ${URL}"
            curl -fsSL --retry 3 -o "${JAR}" "${URL}"
          fi
          echo "path=${JAR}" >> "$GITHUB_OUTPUT"

      # the cfhttp tests of Lucee (label http) and the tests of this extension (tests/) run with the extension installed,
      # so every cfhttp call goes through the extension engine
      - name: Run Lucee Test Suite (labels http, with the extension tests)
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeJar: ${{ steps.lucee-jar.outputs.path }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: http
          testAdditional: ${{ github.workspace }}/tests
          LUCEE_ADMIN_PASSWORD: admin
          HTTPBIN_SERVER: localhost
          HTTPBIN_PORT: 8081

      # the cfhttp tests of Lucee labelled cfhttp and ssl (TLS options, client certificates, trust store)
      - name: Run Lucee Test Suite (labels cfhttp, ssl)
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeJar: ${{ steps.lucee-jar.outputs.path }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: cfhttp,ssl
          LUCEE_ADMIN_PASSWORD: admin
          HTTPBIN_SERVER: localhost
          HTTPBIN_PORT: 8081

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    # deploy only from pushes (or manual runs) on the default branch after the tests passed, never for pull requests or other branches
    if: needs.build-and-test.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 (Oct 2026), which stages maven-metadata-local.xml
        # in the deploy bundle; Central then rejects it
        # ("Bundle has content that does NOT have a .pom file"). Pin 3.9.16 for the deploy.
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn -v

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::no version from the setup job"; exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot $VERSION -------"
            mvn -B -e -f pom.xml clean deploy -Dgoal=deploy --settings maven-settings.xml
          elif [[ "$VERSION" == *-ALPHA ]]; then
            echo "------- Maven Install alpha $VERSION (ALPHA builds are not published) -------"
            mvn -B -e -f pom.xml clean install -Dgoal=install --settings maven-settings.xml
          else
            # final, BETA and RC builds go to Maven Central
            echo "------- Maven Deploy release $VERSION -------"
            mvn -B -e -f pom.xml clean deploy -Dgoal=deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # LDEV-6677: the published .lex files (full and lite) for the github-release job
      - name: Upload artifact for GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: http-release
          path: target/*.lex

  # LDEV-6677: publish every final, BETA and RC build as a GitHub release with its .lex files attached,
  # like the other extensions (LDEV-6511). -SNAPSHOT and ALPHA builds are not published, so they get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central deploy.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup, deploy]
    if: >-
      needs.deploy.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && !endsWith(needs.setup.outputs.version, '-SNAPSHOT')
      && !endsWith(needs.setup.outputs.version, '-ALPHA')
    permissions:
      # create the release (and its tag) and upload its assets
      contents: write
    steps:
      # the files the deploy job built and published
      - name: Download published extension
        uses: actions/download-artifact@v4
        with:
          name: http-release
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f \( -name "*-${VERSION}.lex" -o -name "*-${VERSION}.lite.lex" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version (e.g. 1.0.0.0-BETA), created on this commit
          # if it does not exist yet. BETA/RC are pre-releases and never "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          else
            PRE=(--latest)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} on $GITHUB_SHA"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi
